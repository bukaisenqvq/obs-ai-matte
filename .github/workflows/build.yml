name: Build Plugin

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注意：必须用 gpu 包，CPU 包不含 DirectML 相关 dll
      - name: Download ONNX Runtime (Windows x64, GPU/DirectML)
        run: |
          $v = "1.20.1"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-gpu-$v.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Force ort.zip -DestinationPath third_party
          Move-Item "third_party/onnxruntime-win-x64-gpu-$v" "third_party/onnxruntime"
          Get-ChildItem third_party/onnxruntime -Recurse -Filter *.dll | Select-Object FullName

      - name: Download AI models
        run: |
          New-Item -ItemType Directory -Force -Path data/obs-ai-matte | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx" -OutFile data/obs-ai-matte/isnet-general-use.onnx
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx" -OutFile data/obs-ai-matte/u2net_human_seg.onnx
          (Get-Item data/obs-ai-matte/isnet-general-use.onnx).Length
          (Get-Item data/obs-ai-matte/u2net_human_seg.onnx).Length

      # 该 action 的合法入参只有: target / config / codesign / codesignIdent / codesignTeam / workingDirectory
      - name: Build plugin (obs-plugintemplate)
        uses: obsproject/obs-plugintemplate/.github/actions/build-plugin@master
        with:
          target: x64
          config: RelWithDebInfo
          codesign: false

      - name: Collect package
        run: |
          New-Item -ItemType Directory -Force -Path dist/obs-plugins/64bit | Out-Null
          New-Item -ItemType Directory -Force -Path dist/data/obs-plugins/obs-ai-matte | Out-Null

          $dll = Get-ChildItem -Path . -Recurse -Filter obs-ai-matte.dll -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '\\dist\\' } |
                 Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName -Destination dist/obs-plugins/64bit/ -Force
            Write-Host "plugin dll: $($dll.FullName)"
          } else {
            Write-Host "::error::obs-ai-matte.dll not found in workspace"
            Get-ChildItem release, build_x64 -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
              Select-Object -First 30 FullName
            exit 1
          }

          Get-ChildItem third_party/onnxruntime -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination dist/obs-plugins/64bit/ -Force }

          Copy-Item "data/obs-ai-matte/*.onnx" -Destination dist/data/obs-plugins/obs-ai-matte -ErrorAction SilentlyContinue

          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-ai-matte-windows
          path: dist
